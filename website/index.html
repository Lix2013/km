<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM - الموقع الرسمي</title>
    <style>
        body, html {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: rgb(0, 0, 30);
            color: white;
            text-align: center;
        }

        .code_box {
            display: block;
            width: 250px;
            background-color: rgb(20, 20, 20);
            border: 1px solid rgb(100, 100, 100);
            border-radius: 5px;
            margin: 30px auto; 
            padding: 15px;
            cursor: pointer; 
            transition: background-color 0.3s;
        }

        .code_box:hover {
            background-color: rgb(40, 40, 40);
        }

        .code_box code {
            margin: 0;
            font-size: 1.5rem;
            color: rgb(0, 255, 255);
            font-family: 'Courier New', Courier, monospace;
        }

        h2 {
            color: orange;
        }

        button {
            background-color: rgb(0, 0, 30);
            color: white;
            border: 1px solid rgb(100, 100, 100);
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rgb(40, 40, 40);
        }
    </style>
</head>
<body>

    <h1>KM</h1>
    <h3>Koyot Manager</h3>
    <p>اداة بسيطة و كاملة لتثبيت البكجات و فحص حالة النظام و استهلاك الموارد اضافة الى واجهة عصرية</p>
    <p>[المشروع قيد التطوير]</p>

    

    <div id="main_buttons">
        <hr style="border: 1px solid rgba(169, 169, 169, 0.274)">
        <h2>الشرح</h2>
        <p>عبارة عن مخططات له فقط</p>
        <button onclick="showExplanation(); hideButtons();">الشرح</button>
        <h2>download</h2>
        <button>download</button>
        <h2>قراءة LICENSE</h2>
        <button onclick="window.location.href = 'https://github.com/Lix2013/km/blob/master/LICENSE'">LICENSE</button>
        <hr style="border: 1px solid rgba(169, 169, 169, 0.274)">
    </div>

    <div id="explanation"></div>

    <script>
        function showExplanation() {
            document.getElementById('explanation').innerHTML = `
            <hr style="border: 1px solid rgba(169, 169, 169, 0.274)">
            <h2>شرح بسيط لطريقة التثبيت و الاعداد </h2>
            <hr style="border: 1px solid rgba(169, 169, 169, 0.274)">
    <h2>km auto-setup</h2>
    <p>لاعداد ملفات الاعدادات في الوضع الافتراضي و اضافة مجلدات التطبيقات</p>
    <div class="code_box">
        <code>km auto-setup</code>
    </div>

    <hr style="border: 1px solid rgba(169, 169, 169, 0.274)">

    <h2>km start</h2>
    <p>لتشغيل التطبيق</p>
    <div class="code_box">
        <code>km start</code>
    </div>

    <button onclick="showMainButtons()">اعادة اظهار الازرار</button>
    `
        }

        function hideButtons() {
            document.getElementById('main_buttons').innerHTML = ''
        }

        function showMainButtons() {
            document.getElementById('main_buttons').innerHTML = `
            <hr style="border: 1px solid rgba(169, 169, 169, 0.274)">
        <h2>الشرح</h2>
        <p>عبارة عن مخططات له فقط</p>
        <button onclick="showExplanation(); hideButtons();">الشرح</button>
        <h2>download</h2>
        <button>download</button>
        <h2>قرائة LICENSE<h2>
        <button onclick="window.location.href = 'https://github.com/Lix2013/km/blob/master/LICENSE'">LICENSE</button>
        <hr style="border: 1px solid rgba(169, 169, 169, 0.274)">
        `
            document.getElementById('explanation').innerHTML = '';
        }
    </script>
</body>
</html>
